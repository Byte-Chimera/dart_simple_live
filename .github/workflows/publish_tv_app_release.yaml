name: app-build-action

on:
  workflow_dispatch:
  push:
    tags:
      - "tv_*"

jobs:
  build-tv:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 1. 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 2. 设置 JAVA 环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # 3. 动态生成签名密钥并创建 key.properties
      - name: Generate Keystore & key.properties
        run: |
          mkdir -p simple_live_tv_app/android
          KEYSTORE_PATH="$GITHUB_WORKSPACE/simple_live_tv_app/android/keystore.jks"
          
          # 使用 keytool 自动生成签名证书
          keytool -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "simplelive" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "12345678" \
            -keypass "12345678" \
            -dname "CN=SimpleLive, OU=Dev, O=SimpleLive, L=Default, S=Default, C=CN"

          # 写入 Gradle 所需的 key.properties 配置文件
          cat <<EOF > simple_live_tv_app/android/key.properties
          storeFile=$KEYSTORE_PATH
          storePassword=12345678
          keyPassword=12345678
          keyAlias=simplelive
          EOF

      # 4. 设置 Flutter 环境
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: "stable"
          cache: true

      # 5. 更新 Flutter 依赖
      - name: Restore packages
        run: |
          cd simple_live_tv_app
          flutter pub get

      # 6. 打包 APK
      - name: Build APK
        run: |
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi

      # 7. 上传编译生成的 APK 至 Artifacts
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android_tv
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      # 完成状态输出
      - run: echo "🍏 This job's status is ${{ job.status }}."
