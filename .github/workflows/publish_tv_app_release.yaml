name: app-build-action

on:
  workflow_dispatch:
  push:
    tags:
      - "tv_*"

jobs:
  build-tv:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: master

      # 设置 JAVA 环境
      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # 设置 Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 更新 Flutter packages
      - name: Restore packages
        run: |
          cd simple_live_tv_app
          flutter pub get

      # 打包 APK
      - name: Build APK
        run: |
          cd simple_live_tv_app
          flutter build apk --release --split-per-abi

      # 上传 APK 至 Artifacts（供页面直接下载）
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android_tv
          path: |
            simple_live_tv_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_tv_app/build/app/outputs/flutter-apk/app-x86_64-release.apk

      # 完成提示
      - run: echo "🍏 This job's status is ${{ job.status }}."
